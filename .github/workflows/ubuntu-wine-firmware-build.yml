name: ubuntu wine firmware build

on:
  push:
    tags: [testing]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned for reproducible builds; tested with Wine.
  XMAKE_VERSION: v2.9.9
  # Pre-install a Windows git so xmake does not try to install MinGit itself.
  MINGIT_RELEASE: v2.56.0.windows.4
  MINGIT_ARCHIVE: MinGit-2.56.0.4-64-bit.zip

jobs:
  discover:
    name: Discover firmware projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v5

      - name: Find FW/C projects with a build.bat file
        id: find
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          projects=()
          for dir in FW/C/[0-9]*-*/; do
            dir="${dir%/}"
            [[ -f "$dir/build.bat" ]] || continue
            projects+=("$(basename "$dir")")
          done

          if ((${#projects[@]} == 0)); then
            echo 'projects=[]' >> "$GITHUB_OUTPUT"
            echo "No firmware project containing a build.bat file was found."
          else
            json="$(printf '%s\n' "${projects[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
            echo "projects=${json}" >> "$GITHUB_OUTPUT"
            printf 'Discovered firmware projects: %s\n' "${projects[*]}"
          fi

  build:
    name: Build ${{ matrix.project }}
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    env:
      WINEDEBUG: "-all"
      WINEDLLOVERRIDES: "mscoree,mshtml="
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Initialize git submodules recursively
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Wine
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wine \
            wine64 \
            wine32:i386
          wine --version

      - name: Initialize the Wine prefix
        shell: bash
        run: |
          set -euo pipefail
          wineboot -u

      - name: Install Windows xmake into Wine
        shell: bash
        run: |
          set -euo pipefail

          # Do not let a host-side xmake installation leak into Wine.
          unset XMAKE_PROGRAM_DIR XMAKE_PROGRAM_FILE XMAKE_ROOTDIR XMAKE_SHELL

          wine_prefix="${WINEPREFIX:-$HOME/.wine}"
          mkdir -p "${wine_prefix}/drive_c"

          curl -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/xmake.zip" \
            "https://github.com/xmake-io/xmake/releases/download/${XMAKE_VERSION}/xmake-${XMAKE_VERSION}.win64.zip"

          rm -rf "${wine_prefix}/drive_c/xmake"
          unzip -q -o "${RUNNER_TEMP}/xmake.zip" -d "${wine_prefix}/drive_c"

          # Append C:\xmake to the PATH stored in the Wine registry.
          current_path="$(wine cmd /c 'echo %PATH%' | tr -d '\r' | tail -n 1)"
          wine reg add 'HKCU\Environment' \
            /v Path /t REG_EXPAND_SZ \
            /d "C:\\xmake;${current_path}" /f

          wine cmd /c xmake --version

      - name: Install Windows git into Wine
        shell: bash
        run: |
          set -euo pipefail

          wine_prefix="${WINEPREFIX:-$HOME/.wine}"
          mkdir -p "${wine_prefix}/drive_c"

          curl -fsSL --retry 3 \
            -o "${RUNNER_TEMP}/mingit.zip" \
            "https://github.com/git-for-windows/git/releases/download/${MINGIT_RELEASE}/${MINGIT_ARCHIVE}"

          rm -rf "${wine_prefix}/drive_c/git"
          unzip -q -o "${RUNNER_TEMP}/mingit.zip" -d "${wine_prefix}/drive_c/git"

          # Prepend git to the PATH stored in the Wine registry.
          current_path="$(wine cmd /c 'echo %PATH%' | tr -d '\r' | tail -n 1)"
          wine reg add 'HKCU\Environment' \
            /v Path /t REG_EXPAND_SZ \
            /d "C:\\git\\cmd;C:\\git\\mingw64\\bin;${current_path}" /f

          wine cmd /c git --version

      - name: Clean the SDK out directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf FW/C/sdk/out
          mkdir -p FW/C/sdk/out

      - name: Build ${{ matrix.project }} with Wine
        env:
          PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail

          # Do not let a host-side xmake installation leak into Wine.
          unset XMAKE_PROGRAM_DIR XMAKE_PROGRAM_FILE XMAKE_ROOTDIR XMAKE_SHELL

          cd "FW/C/${PROJECT}"

          # The workflow workspace is temporary, so patch build.bat in place
          # at build time (the committed source is never changed) to turn
          # "pause" into a proper error exit.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.bat")
          data = path.read_bytes()

          if data.count(b"\r\npause\r\n") != 2:
              raise SystemExit("unexpected standalone pause count in build.bat")

          failure = b'if NOT "X%ERRORLEVEL%" == "X0" PAUSE'
          if failure not in data:
              raise SystemExit("xmake failure check not found in build.bat")

          if data.count(b"\r\ngoto :eof") != 5:
              raise SystemExit("unexpected goto :eof count in build.bat")

          # A failed firmware build must stop with a non-zero exit code.
          data = data.replace(
              failure,
              b'if "X%ERRORLEVEL%" == "X0" goto :BuildOk\r\n'
              b"echo Build failed, errorlevel: %ERRORLEVEL%\r\n"
              b"exit /b %ERRORLEVEL%\r\n"
              b":BuildOk",
          )

          # Pre-check failures must stop with a non-zero exit code.
          data = data.replace(b"\r\npause\r\n", b"\r\nexit /b 1\r\n")

          # The remaining cmake/ninja/gcc checks only drive optional CodeBlocks
          # project generation, so they must not fail a successful build.
          data = data.replace(b"\r\ngoto :eof", b"\r\nexit /b 0")
          data = data.replace(b"exit /b 1\r\nexit /b 0", b"exit /b 1")

          if b"pause" in data.lower():
              raise SystemExit("pause remaining after patching build.bat")

          path.write_bytes(data)
          PY

          set +e
          timeout 120m wine cmd /c build.bat \
            2>&1 | tee "${RUNNER_TEMP}/build-${PROJECT}.log"
          status=${PIPESTATUS[0]}
          set -e

          if ((status != 0)); then
            echo "::error::build.bat exited with status ${status} for ${PROJECT}."
            exit "$status"
          fi

          echo "build.bat succeeded."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.project }}
          path: ${{ runner.temp }}/build-${{ matrix.project }}.log
          if-no-files-found: ignore

      - name: Package ${{ matrix.project }}
        env:
          PROJECT: ${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail

          out_dir="FW/C/sdk/out"
          dist_dir="${RUNNER_TEMP}/dist"
          mkdir -p "$dist_dir"

          shopt -s nullglob
          subdirs=("$out_dir"/*/)
          if ((${#subdirs[@]} == 0)); then
            echo "::error::No output directory was produced under ${out_dir}."
            exit 1
          fi

          if [[ -z "$(find "$out_dir" -mindepth 2 -maxdepth 2 -name '*.elf' -print -quit)" ]]; then
            echo "::error::No .elf firmware image was produced for ${PROJECT}."
            exit 1
          fi

          if [[ -z "$(find "$out_dir" -mindepth 2 -maxdepth 2 \
              \( -name '*.binpkg' -o -name '*.soc' \) -print -quit)" ]]; then
            echo "::error::No .binpkg/.soc firmware package was produced for ${PROJECT}."
            exit 1
          fi

          names=()
          for dir in "${subdirs[@]}"; do
            names+=("$(basename "$dir")")
          done

          tar -czf "${dist_dir}/${PROJECT}-C-snapshot.tar.gz" \
            -C "$out_dir" "${names[@]}"

          echo "Created ${PROJECT}-C-snapshot.tar.gz:"
          tar -tzf "${dist_dir}/${PROJECT}-C-snapshot.tar.gz"

      - name: Upload ${{ matrix.project }} package
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.project }}
          path: ${{ runner.temp }}/dist/${{ matrix.project }}-C-snapshot.tar.gz
          if-no-files-found: error

  release:
    name: Publish testing release
    needs: [discover, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware packages
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Publish to the testing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          files=("${RUNNER_TEMP}"/dist/*-C-snapshot.tar.gz)
          if [[ ! -e "${files[0]}" ]]; then
            echo "::error::No firmware snapshot packages were downloaded."
            exit 1
          fi

          if ! gh release view testing >/dev/null 2>&1; then
            gh release create testing \
              --prerelease \
              --title "testing" \
              --notes "Automated firmware snapshots for tag \`testing\`." \
              --target "$GITHUB_SHA"
          fi

          gh release upload testing "${files[@]}" --clobber
